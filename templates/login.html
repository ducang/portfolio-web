<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<main>

    <h1>Admin Login</h1>

    {% if error %}
        <p class="login-error">
            {{ error }}
        </p>
    {% endif %}

    <form class="admin-form" method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>
            Username

            <input
                type="text"
                name="username"
                required
            >
        </label>

        <label>
            Password

            <input
                type="password"
                name="password"
                required
            >
        </label>

        <button type="submit">
            Login
        </button>

    </form>

</main>

</body>

</html>
