<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<main>

    <h1>Admin Login</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>
            Username

            <input
                type="text"
                name="username"
                required
            >
        </label>

        <label>
            Password

            <input
                type="password"
                name="password"
                required
            >
        </label>

        <button type="submit">
            Login
        </button>

    </form>

</main>

</body>

</html>
